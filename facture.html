<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre facture — Maxiconfort</title>
<meta name="theme-color" content="#185FA5">
<link rel="icon" type="image/png" href="favicon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background:#F4F3EF; color:#1a1a18; font-size:14px; padding:16px; }
.wrap { max-width: 720px; margin: 0 auto; }
.toolbar { display:flex; gap:8px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
.toolbar button { padding:11px 20px; border:none; border-radius:10px; background:#185FA5; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
.toolbar button.alt { background:#fff; color:#185FA5; border:1.5px solid #185FA5; }
.sheet { background:#fff; border-radius:12px; padding:36px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.logo { font-size:24px; font-weight:900; color:#185FA5; }
.logo span { color:#BA7517; }
.head { display:flex; justify-content:space-between; gap:20px; margin-bottom:30px; flex-wrap:wrap; }
.bms { font-size:12px; color:#444; line-height:1.6; margin-top:6px; }
.client { text-align:right; line-height:1.6; }
h1 { font-size:20px; margin:16px 0 2px; color:#185FA5; }
.meta { color:#666; margin-bottom:16px; }
table { width:100%; border-collapse:collapse; margin:16px 0; }
th { background:#185FA5; color:#fff; padding:9px 10px; text-align:left; font-size:11px; text-transform:uppercase; }
td { padding:10px; border-bottom:1px solid #e3e3e0; }
.tot { width:280px; margin-left:auto; }
.tot td { border:none; padding:5px 10px; text-align:right; }
.tot .label { color:#666; }
.tot .ttc { font-size:17px; font-weight:900; color:#185FA5; border-top:2px solid #185FA5; }
.acquit { display:inline-block; margin-top:14px; padding:6px 16px; border:2px solid #276749; color:#276749; font-weight:900; border-radius:6px; transform:rotate(-3deg); }
.apayer { display:inline-block; margin-top:14px; padding:6px 16px; border:2px solid #A32D2D; color:#A32D2D; font-weight:900; border-radius:6px; }
.footer { margin-top:46px; font-size:10px; color:#888; text-align:center; border-top:1px solid #ddd; padding-top:12px; line-height:1.6; }
.state { text-align:center; padding:60px 20px; color:#777; }
.state .ico { font-size:44px; margin-bottom:14px; }
@media print {
  body { background:#fff; padding:0; }
  .toolbar { display:none; }
  .sheet { box-shadow:none; border-radius:0; padding:14mm; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar" id="toolbar" style="display:none">
    <button onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>
  </div>
  <div id="content">
    <div class="state"><div class="ico">⏳</div>Chargement de votre facture…</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://jmvfjtnmebstkzcfnlgp.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptdmZqdG5tZWJzdGt6Y2ZubGdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTYxODYsImV4cCI6MjA5NDM3MjE4Nn0.t_zyGmY96wUB_hk63WOSYZniBy_9oHwfpDvcxwl2s5U';

// Mentions legales (entite de facturation) — memes valeurs que dans l'app (LITIGE_BMS)
const BMS = {
  nom: 'BMS',
  adresse: '60 rue François 1er, 75008 Paris',
  forme: 'SAS au capital de 1,00 €',
  rcs: 'RCS Paris 993 863 687',
  tva: 'FR29993863687'
};

function getToken() {
  var p = new URLSearchParams(window.location.search);
  var t = p.get('t');
  if (t) return t;
  var m = window.location.pathname.match(/\/f\/([a-f0-9-]+)/i);
  return m ? m[1] : null;
}
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function fmt(n){ return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }

function erreur(msg) {
  document.getElementById('content').innerHTML =
    '<div class="state"><div class="ico">❌</div><div style="font-weight:700;margin-bottom:8px;color:#A32D2D">'+msg+'</div>'+
    '<div style="font-size:13px">Vérifiez le lien reçu par SMS ou WhatsApp.</div></div>';
}

async function charger() {
  var token = getToken();
  if (!token) { erreur('Lien de facture invalide'); return; }
  try {
    var resp = await fetch(SUPABASE_URL + '/rest/v1/commandes?tracking_token=eq.' + encodeURIComponent(token) +
      '&select=id,client,adresse,tel,produit,lignes,qte,prix,paie,stpaie,date_commande', {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'x-tracking-token': token }
    });
    if (!resp.ok) { erreur('Facture introuvable ou lien expiré'); return; }
    var data = await resp.json();
    if (!data || !data.length) { erreur('Aucune facture trouvée pour ce lien'); return; }
    afficher(data[0]);
  } catch(e) { erreur('Erreur de chargement'); }
}

function afficher(cmd) {
  var ttc = parseFloat(cmd.prix) || 0;
  var ht = ttc / 1.2;
  var tva = ttc - ht;
  var dateFact = (cmd.date_commande && cmd.date_commande.length === 10) ? cmd.date_commande : new Date().toLocaleDateString('fr-CA');
  var dateFr = new Date(dateFact + 'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  var numFact = 'F' + dateFact.substring(0,4) + '-' + (cmd.id||'').replace('#','');
  var lignes = (cmd.lignes && cmd.lignes.length) ? cmd.lignes : [{nom:cmd.produit, qte:cmd.qte||1, sousTotal:ttc}];
  var lignesHtml = lignes.map(function(l){
    var st = parseFloat(l.sousTotal!=null ? l.sousTotal : (parseFloat(l.prixUnit||0)*(l.qte||1))) || 0;
    return '<tr><td>'+esc(l.nom||l.produit||'—')+'</td><td style="text-align:center">'+(l.qte||1)+'</td><td style="text-align:right">'+fmt(st)+'</td></tr>';
  }).join('');
  var acquit = cmd.stpaie === 'Payé';
  document.title = 'Facture ' + numFact + ' — Maxiconfort';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('content').innerHTML =
    '<div class="sheet">' +
      '<div class="head">' +
        '<div><div class="logo">Maxi<span>confort</span></div>' +
          '<div class="bms"><strong>'+BMS.nom+'</strong> — '+BMS.forme+'<br>'+BMS.adresse+'<br>'+BMS.rcs+'<br>TVA : '+BMS.tva+'</div></div>' +
        '<div class="client"><strong>Facturé à</strong><br>'+esc(cmd.client)+'<br>'+esc(cmd.adresse||'')+(cmd.tel?'<br>'+esc(cmd.tel):'')+'</div>' +
      '</div>' +
      '<h1>Facture n° '+numFact+'</h1>' +
      '<div class="meta">Date : '+dateFr+' — Référence commande : '+esc(cmd.id)+'</div>' +
      '<table><thead><tr><th>Désignation</th><th style="width:60px;text-align:center">Qté</th><th style="width:130px;text-align:right">Montant TTC</th></tr></thead><tbody>'+lignesHtml+'</tbody></table>' +
      '<table class="tot"><tbody>' +
        '<tr><td class="label">Total HT</td><td>'+fmt(ht)+'</td></tr>' +
        '<tr><td class="label">TVA 20 %</td><td>'+fmt(tva)+'</td></tr>' +
        '<tr><td class="label ttc">Total TTC</td><td class="ttc">'+fmt(ttc)+'</td></tr>' +
      '</tbody></table>' +
      '<div style="text-align:right">'+(acquit?'<span class="acquit">FACTURE ACQUITTÉE'+(cmd.paie?' — '+esc(cmd.paie):'')+'</span>':'<span class="apayer">À RÉGLER</span>')+'</div>' +
      '<div class="footer">'+BMS.nom+' — '+BMS.forme+' — '+BMS.rcs+' — TVA intracommunautaire : '+BMS.tva+'<br>Siège social : '+BMS.adresse+'<br>Merci de votre confiance — Maxiconfort</div>' +
    '</div>';
}

charger();
</script>
</body>
</html>
