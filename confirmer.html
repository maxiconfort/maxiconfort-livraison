<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmer ma livraison — Maxiconfort</title>
<meta name="theme-color" content="#185FA5">
<link rel="icon" type="image/png" href="favicon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:#185FA5; --bl:#E6F1FB; --bd:#0C447C;
  --green:#3B6D11; --gl:#EAF3DE; --gd:#27500A;
  --orange:#BA7517; --ol:#FAEEDA; --od:#633806;
  --red:#A32D2D; --rl:#FCEBEB; --rd:#791F1F;
  --bg:#F4F3EF; --card:#FFFFFF; --text:#1A1A18; --t2:#5F5E5A; --t3:#9C9A92;
  --brd:rgba(0,0,0,0.09); --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; --r:14px;
}
body { font-family:var(--font); background:var(--bg); color:var(--text); font-size:15px; min-height:100vh; padding:18px; }
.wrap { max-width:480px; margin:0 auto; }
.logo { text-align:center; margin:8px 0 18px; }
.logo-name { font-size:24px; font-weight:900; color:var(--blue); }
.logo-name span { color:var(--orange); }
.card { background:var(--card); border-radius:var(--r); padding:22px 18px; margin-bottom:14px; box-shadow:0 1px 6px rgba(0,0,0,0.07); border:1px solid var(--brd); }
.q { font-size:19px; font-weight:800; text-align:center; margin-bottom:6px; line-height:1.35; }
.sub { text-align:center; color:var(--t2); font-size:14px; line-height:1.5; margin-bottom:4px; }
.info { background:var(--bl); border-radius:12px; padding:12px 14px; margin:16px 0; font-size:14px; line-height:1.7; color:var(--bd); }
.info b { color:var(--text); }
.btns { display:flex; flex-direction:column; gap:12px; margin-top:18px; }
.btn { padding:18px; border:none; border-radius:14px; font-size:17px; font-weight:800; cursor:pointer; font-family:var(--font); display:flex; align-items:center; justify-content:center; gap:10px; transition:transform .08s; }
.btn:active { transform:scale(.98); }
.btn-ok { background:var(--green); color:#fff; }
.btn-no { background:#fff; color:var(--red); border:2px solid var(--red); }
.state { text-align:center; padding:60px 20px; color:var(--t3); }
.state .ico { font-size:52px; margin-bottom:16px; }
.merci-ico { font-size:64px; margin-bottom:10px; }
.footer { text-align:center; font-size:13px; color:var(--t3); padding:14px 0; line-height:1.6; }
.footer a { color:var(--blue); text-decoration:none; font-weight:600; }
.spin { display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="logo-name">Maxi<span>confort</span></div></div>
  <div id="content">
    <div class="state"><div class="ico">⏳</div>Chargement…</div>
  </div>
  <div class="footer">
    Une question ? <a id="contact" href="tel:0972149805">📞 09 72 14 98 05</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://jmvfjtnmebstkzcfnlgp.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptdmZqdG5tZWJzdGt6Y2ZubGdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTYxODYsImV4cCI6MjA5NDM3MjE4Nn0.t_zyGmY96wUB_hk63WOSYZniBy_9oHwfpDvcxwl2s5U';

function getToken() {
  var p = new URLSearchParams(location.search);
  var t = p.get('t');
  if (t) return t;
  var m = location.pathname.match(/\/c\/([a-f0-9-]+)/i);
  return m ? m[1] : null;
}
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function prenom(nom){ return (nom||'').replace(/^(M\.|Mme|Mr\.?)\s*/i,'').split(' ')[0] || ''; }
function dateFr(s){ if(!s) return ''; var d=new Date(s+'T12:00:00'); if(isNaN(d)) return s; return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }

function erreur(msg) {
  document.getElementById('content').innerHTML =
    '<div class="state"><div class="ico">❌</div><div style="font-weight:700;color:var(--red);margin-bottom:8px">'+msg+'</div>'+
    '<div style="font-size:13px">Vérifiez le lien reçu par SMS.</div></div>';
}

var CMD = null;
async function charger() {
  var token = getToken();
  if (!token) { erreur('Lien invalide'); return; }
  try {
    var r = await fetch(SUPABASE_URL + '/rest/v1/commandes?tracking_token=eq.' + encodeURIComponent(token) +
      '&select=id,client,produit,adresse,date_livraison,statut,confirmation_presence', {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'x-tracking-token': token }
    });
    if (!r.ok) { erreur('Livraison introuvable'); return; }
    var d = await r.json();
    if (!d || !d.length) { erreur('Aucune livraison trouvée pour ce lien'); return; }
    CMD = d[0];
    // Déjà livré ou annulé : pas de confirmation à demander
    if (CMD.statut === 'livré') { ecranInfo('✅', 'Commande déjà livrée', 'Cette commande a déjà été livrée. Merci de votre confiance !'); return; }
    if (CMD.statut === 'annulé') { ecranInfo('❌', 'Commande annulée', 'Cette commande est annulée. Une question ? Contactez-nous.'); return; }
    afficherQuestion();
  } catch(e) { erreur('Erreur de chargement'); }
}

function ecranInfo(ico, titre, sous) {
  document.getElementById('content').innerHTML =
    '<div class="card" style="text-align:center"><div class="merci-ico">'+ico+'</div>'+
    '<div class="q">'+esc(titre)+'</div><div class="sub" style="margin-top:8px">'+esc(sous)+'</div></div>';
}

function afficherQuestion() {
  var p = prenom(CMD.client);
  var dTxt = dateFr(CMD.date_livraison);
  document.getElementById('content').innerHTML =
    '<div class="card">'+
      '<div class="q">Bonjour '+esc(p)+' 👋<br>Serez-vous présent pour votre livraison ?</div>'+
      '<div class="info">'+
        (dTxt ? '📅 Livraison prévue <b>'+esc(dTxt)+'</b><br>' : '') +
        '📦 '+esc(CMD.produit||'Votre commande')+'<br>'+
        '📍 '+esc(CMD.adresse||'')+
      '</div>'+
      '<div class="sub">Merci de nous confirmer, ça nous évite un déplacement pour rien 🙏</div>'+
      '<div class="btns">'+
        '<button class="btn btn-ok" onclick="repondre(\'confirme\')">✅ Oui, je serai présent</button>'+
        '<button class="btn btn-no" onclick="repondre(\'reporter\')">📅 Non, je ne serai pas là</button>'+
      '</div>'+
    '</div>';
}

var ENVOI = false;
async function repondre(choix) {
  if (ENVOI) return; ENVOI = true;
  var btns = document.querySelectorAll('.btn');
  btns.forEach(function(b){ b.disabled = true; b.style.opacity = '.6'; });
  var cliq = (choix === 'confirme') ? btns[0] : btns[1];
  if (cliq) cliq.innerHTML = '<span class="spin"></span> Envoi…';
  try {
    var r = await fetch(SUPABASE_URL + '/functions/v1/confirmer-presence', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify({ token: getToken(), choix: choix })
    });
    var d = await r.json();
    if (!d.ok) throw new Error(d.reason || 'erreur');
    if (choix === 'confirme') {
      ecranInfo('🎉', 'Parfait, c\'est noté !', 'Merci ' + prenom(CMD.client) + ' ! Notre livreur passera comme prévu. À très vite 📦');
    } else {
      ecranInfo('📅', 'Bien reçu', 'C\'est noté, nous ne passerons pas. Nous vous recontactons pour reprogrammer votre livraison à un moment qui vous arrange.');
    }
  } catch(e) {
    ENVOI = false;
    document.getElementById('content').innerHTML =
      '<div class="card" style="text-align:center"><div class="merci-ico">⚠️</div>'+
      '<div class="q">Oups</div><div class="sub" style="margin:8px 0 16px">Une erreur est survenue. Réessayez.</div>'+
      '<button class="btn btn-ok" onclick="afficherQuestion()" style="background:var(--blue)">↩ Réessayer</button></div>';
  }
}

charger();
</script>
</body>
</html>
